<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" 
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" 
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
        <div class="container">
            <h1>Currency Converter</h1>
            <form action="">
                <div class="form">
                    <div class="amount">
                        <p>Enter Amount</p>
                        <input type="text" id="blank">
                    </div>
                    <div class="toFrom">
                        <div class="from">
                                <p>From</p>
                                <div class="select-container">
                                    <img src="https://flagsapi.com/IN/flat/64.png" alt="National Flag" class="view">
                                    <select name="from"></select>  
                                </div>
                        </div>
                        <div class="exc">
                            <i class="fa-solid fa-arrow-right-arrow-left"></i>
                        </div>
                        <div class="to">
                                <p>To</p>
                                <div class="select-container">
                                    <img src="https://flagsapi.com/US/flat/64.png" alt="National Flag" class="view">
                                    <select name="to"></select>                                    
                                </div>
                        </div>
                    </div>
                    <div class="conv">
                       <p>1USD =  86.132434<p>
                    </div>
                    <div class="final_conversion">
                        <button class="btn">Get Exchange Rate</button>
                     </div>
                </div>
            </form>
        </div>
        <script src="codes.js"></script>
        <script src="app.js"></script>

    </body>
</html>
